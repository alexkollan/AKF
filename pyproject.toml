[project]
name = "afk"
version = "0.1.0"
description = "Pixel/audio fishing bot for WoW Forever, with a local engine service and a React UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dxcam>=0.0.5",
    "mss>=9.0.2",
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "pillow>=10.4",
    "pyaudiowpatch>=0.2.12.7",
    "pywin32>=306",
    "pynput>=1.7.7",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pywebview>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pyinstaller>=6.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints are mandatory, see CLAUDE.md)
    "ASYNC",
    "RUF",
]
ignore = [
    "ANN401",  # Any is allowed where a payload is genuinely untyped
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "needs_game: requires World of Warcraft to be running (skipped in CI)",
    "needs_fixtures: requires recorded clips in tests/fixtures",
]
